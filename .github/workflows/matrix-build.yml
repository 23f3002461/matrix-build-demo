name: Multi-Platform Matrix Build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]  # 3 variants
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: matrix-7eafe22
        run: echo "Running matrix build on OS = ${{ matrix.os }}"

      - name: Generate build artifact
        run: |
          echo "Build output for platform ${{ matrix.os }}" > build-output-${{ matrix.os }}.txt
          echo "Timestamp: $(date)" >> build-output-${{ matrix.os }}.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-7eafe22-${{ matrix.os }}
          path: build-output-${{ matrix.os }}.txt
